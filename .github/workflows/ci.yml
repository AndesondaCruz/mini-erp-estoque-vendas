# Pipeline de integração contínua.
#
# Roda em todo Pull Request para a main e em todo push na main.
# Um PR só é mergeado com tudo verde: formato, lint, tipos, testes
# unitários, testes e2e (com Postgres real), build, auditoria e Docker.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um novo push na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Princípio do menor privilégio: o pipeline só lê o repositório.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    # Postgres de verdade para os testes e2e (mesma versão do docker-compose).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: mini_erp
          POSTGRES_DB: mini_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp -d mini_erp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://mini_erp:mini_erp@localhost:5432/mini_erp_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # O campo allowScripts do package.json só é respeitado pelo npm 11;
      # o Node 22 vem com o npm 10, que executaria todos os scripts de instalação.
      - name: Atualizar npm
        run: npm install -g npm@11

      - name: Instalar dependências (gera o client do Prisma)
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tipagem (tsc)
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes e2e (Postgres real)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Constrói a imagem e sobe banco + API exatamente como no ambiente local.
      # --wait: só continua quando todos os healthchecks estiverem verdes.
      - name: Subir o ambiente completo (docker compose)
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test da API
        run: |
          set -e
          curl --fail --silent http://localhost:3000/api/v1/health | grep -q '"database":"up"'
          curl --fail --silent --output /dev/null http://localhost:3000/api/docs
          # Migrations aplicadas pelo entrypoint num banco vazio + seed + login de verdade.
          docker compose logs api | grep -q "migration"
          docker compose exec -T api node dist/seed.js
          curl --fail --silent -X POST http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@mini-erp.local","password":"admin-local-123"}' \
            | grep -q '"role":"ADMIN"'
          test "$(docker compose exec -T api whoami)" = "node"
          echo "API, banco, Swagger, migrations, seed e login funcionando; container sem root."

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down --volumes
