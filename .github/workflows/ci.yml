# Pipeline de integração contínua.
#
# Roda em todo Pull Request para a main e em todo push na main.
# Um PR só é mergeado com tudo verde: formato, lint, tipos, testes
# unitários, testes e2e (com Postgres real), build, auditoria e Docker,
# para o back-end e para o front-end (jobs em paralelo).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um novo push na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Princípio do menor privilégio: o pipeline só lê o repositório.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    # Postgres de verdade para os testes e2e (mesma versão do docker-compose).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: mini_erp
          POSTGRES_DB: mini_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp -d mini_erp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://mini_erp:mini_erp@localhost:5432/mini_erp_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # O campo allowScripts do package.json só é respeitado pelo npm 11;
      # o Node 22 vem com o npm 10, que executaria todos os scripts de instalação.
      - name: Atualizar npm
        run: npm install -g npm@11

      - name: Instalar dependências (gera o client do Prisma)
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tipagem (tsc)
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes e2e (Postgres real)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Atualizar npm
        run: npm install -g npm@11

      - name: Instalar dependências
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (oxlint, com regras de acessibilidade)
        run: npm run lint

      - name: Tipagem (tsc)
        run: npm run typecheck

      - name: Testes (Testing Library, MSW e axe-core)
        run: npm test

      - name: Build
        run: npm run build

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Constrói as imagens e sobe banco + API + front exatamente como no
      # ambiente local. --wait: só continua quando todos os healthchecks
      # estiverem verdes.
      - name: Subir o ambiente completo (docker compose)
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Migrations, seeds e API sem root
        run: |
          set -e
          # Migrations aplicadas pelo entrypoint num banco vazio.
          docker compose logs api | grep -q "migration"
          # Seed de demo dentro da imagem (banco vazio: sem --reset).
          docker compose exec -T api node dist/seed-demo.js
          # O seed do primeiro ADMIN também carrega na imagem; com o ADMIN
          # demo já criado, ele não cria outro.
          docker compose exec -T api node dist/seed.js | grep -q "Nada a fazer"
          test "$(docker compose exec -T api whoami)" = "node"

      # Tudo entra pela porta do Nginx (8080): front, API e Swagger. O mesmo
      # script roda localmente (instruções no topo dele).
      - name: Smoke test pelo Nginx
        run: sh docker/smoke-test.sh

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down --volumes
