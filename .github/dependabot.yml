# Dependabot: abre PRs semanais com atualizações de dependências.
# Cada PR passa pelo CI antes do merge, então atualizar fica seguro.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest e @vitest/* precisam ter a mesma versão: chegam num PR só.
      vitest:
        patterns: ['vitest', '@vitest/*']
      # Agrupa atualizações menores num único PR, para reduzir ruído.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma é fixado numa versão exata: o "latest" do npm apontou para um
      # release candidate (8.0.0-rc). A migração para o 8 será uma decisão própria.
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major]
      # Os tipos do Node acompanham a versão do runtime (Node 22, ver .nvmrc).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react, react-dom e os tipos precisam andar juntos.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      testes:
        patterns: ['vitest', 'jsdom', '@testing-library/*']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Trocar a versão do Node é uma decisão própria, junto com .nvmrc,
      # CI e @types/node. Patches e minors da imagem continuam chegando.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
