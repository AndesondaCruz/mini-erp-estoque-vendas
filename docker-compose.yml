# Ambiente local do Mini-ERP.
#
#   docker compose up -d db          -> só o banco (desenvolvimento: API roda com npm run start:dev)
#   docker compose up --build --wait -> banco + API + front (Nginx), como em produção
#
# Com tudo em containers, a única porta publicada é a do Nginx (8080): o front,
# a API em /api/v1 e o Swagger em /api/docs entram por ela. A API não fica
# exposta direto porque confia no X-Forwarded-For do Nginx (TRUST_PROXY=1):
# quem falasse com ela sem passar pelo Nginx poderia forjar o IP e escapar
# do rate limit.
#
# As credenciais abaixo são só para uso local. Em produção vêm de variáveis do provedor.

name: mini-erp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mini_erp
      POSTGRES_PASSWORD: mini_erp
      POSTGRES_DB: mini_erp
    ports:
      # 5433 no host para não conflitar com outro Postgres local na 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mini_erp -d mini_erp']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://mini_erp:mini_erp@db:5432/mini_erp
      CORS_ORIGINS: http://localhost:5173
      REPORTS_TIMEZONE: America/Fortaleza
      LOG_LEVEL: info
      # Um proxy na frente: o Nginx do serviço web.
      TRUST_PROXY: 1
      # Valores só para uso local. Em produção, o segredo vem do provedor
      # (Render) e é gerado com: node -e "console.log(require('node:crypto').randomBytes(48).toString('base64url'))"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-segredo-local-do-docker-compose-nao-use-em-producao}
      SEED_ADMIN_NAME: Administrador
      SEED_ADMIN_EMAIL: admin@mini-erp.local
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-local-123}
      # Este Compose é a forma de avaliar o projeto localmente: protege as
      # contas demo e permite "node dist/seed-demo.js --reset" (que, com
      # NODE_ENV=production, só roda com DEMO_MODE=true).
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-mini-erp}
    # Sem "ports": a API só é acessível pela rede interna do Compose (pelo
    # Nginx). Para chamar a API direto, use o modo de desenvolvimento.
    depends_on:
      # Só sobe a API quando o banco responder. Sem isso, a API tenta
      # conectar num banco que ainda está iniciando.
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Tenta no máximo 5 vezes. "unless-stopped" reiniciaria para sempre
    # se o banco estiver fora do ar, gastando CPU sem resolver nada.
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 384m

  web:
    build: ./frontend
    ports:
      - '8080:8080'
    depends_on:
      # O Nginx resolve o nome "api" ao iniciar: a API precisa existir antes.
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  pgdata:
