# Cabeçalhos de segurança das páginas do front. Ficam num arquivo à parte
# porque o Nginx não herda add_header do server quando a location tem os
# seus próprios (o Cache-Control): cada location inclui este arquivo.

# CSP: só código e estilos servidos por esta origem. Sem 'unsafe-inline':
# o build do Vite não gera script inline, e os style={{}} do React são
# aplicados pelo JavaScript (CSSOM), o que a CSP não bloqueia.
# connect-src 'self': a API está na mesma origem (/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
