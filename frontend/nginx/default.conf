# Nginx do Compose: serve o front e repassa /api para a API.
#
# Uma origem só para o navegador (http://localhost:8080): o cookie de refresh
# (SameSite=Strict, Path=/api/v1/auth) é de primeira parte, como no proxy do
# Vite em desenvolvimento e no rewrite da Vercel em produção.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Não anuncia a versão do Nginx nos cabeçalhos e páginas de erro.
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API (inclusive o Swagger em /api/docs). Os cabeçalhos de segurança da
    # API vêm do helmet, no próprio NestJS.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O IP de quem conectou no Nginx. A API confia em um proxy
        # (TRUST_PROXY=1) e usa o último endereço desta lista como IP do
        # cliente, então o rate limit vale por IP real. Sobrescrever (em vez
        # de acrescentar com $proxy_add_x_forwarded_for, que também seria
        # seguro com TRUST_PROXY=1) deixa claro que o valor do cliente é
        # descartado. Nunca repasse $http_x_forwarded_for sem alteração:
        # a API usaria o IP forjado pelo cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Arquivos com hash no nome (index-sctyhndw.js): o conteúdo nunca muda
    # para o mesmo nome, então o navegador pode guardar por um ano.
    # Arquivo que não existe dá 404 (não o index.html): um pedaço de página
    # antigo, de antes de um deploy, falha de forma clara.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: qualquer outro caminho (/vendas/123 depois de um F5) devolve o
    # index.html e o React Router decide a tela. O index.html nunca fica em
    # cache: depois de um deploy, ele aponta para os arquivos novos.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
